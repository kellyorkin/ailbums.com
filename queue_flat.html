<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Monthly Queue — flat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --parchment:#f4ead2; --ink:#4a3a22; --line:rgba(156,138,106,.55);
    --today:#b06a2a; --today-bg:rgba(232,163,61,.28);
    --past:rgba(120,100,70,.16); --weekend:rgba(180,160,120,.14);
    --dark:#2b2119; --cream:#e8ddc2;
    --sev-R:#6b6b5a; --sev-U:#b06a2a; --sev-S:#8a3a2a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    font-family:'Special Elite',Georgia,serif; color:var(--ink);
    background:#3a2416;
    background-image:
      repeating-linear-gradient(94deg, rgba(0,0,0,.16) 0 2px, rgba(255,255,255,.02) 2px 5px, rgba(0,0,0,.10) 5px 9px),
      linear-gradient(180deg,#4a2f1b,#2e1d10);
    background-attachment:fixed;
    padding:clamp(8px,3vw,28px); -webkit-tap-highlight-color:transparent;
  }
  .pad{max-width:960px; margin:0 auto; background:var(--parchment); border-radius:7px;
    box-shadow:0 10px 30px rgba(0,0,0,.45); overflow:hidden; border:1px solid rgba(0,0,0,.25)}
  .header{background:var(--dark); color:var(--cream); display:flex; align-items:center;
    justify-content:space-between; gap:10px; padding:clamp(8px,2.4vw,14px) clamp(10px,3vw,20px);
    font-size:clamp(11px,3.2vw,16px); letter-spacing:.08em; text-transform:uppercase}
  .header .right{opacity:.9; font-size:.82em; text-align:right}
  .board{padding:clamp(8px,2.6vw,18px)}
  .dow,.cal{display:grid; grid-template-columns:repeat(7,1fr); gap:clamp(3px,1.2vw,7px)}
  .dow{margin-bottom:clamp(3px,1.2vw,7px)}
  .dow span{text-align:center; font-size:clamp(8px,2.4vw,11px); letter-spacing:.14em; color:#8a7a5c; padding:2px 0}
  .cell{position:relative; min-height:clamp(46px,13.5vw,86px); border:1px dashed var(--line);
    border-radius:4px; background:rgba(250,244,224,.10); padding:3px 4px; touch-action:manipulation; overflow:visible}
  .cell .num{font-size:clamp(8px,2.6vw,12px); color:#8a7a5c; line-height:1}
  .cell.past{background:var(--past); opacity:.62} .cell.weekend{background:var(--weekend)}
  .cell.off{background:rgba(120,100,70,.10); border-style:solid; border-color:rgba(120,100,70,.18)}
  .cell.today{background:var(--today-bg); border:2px solid var(--today)}
  .cell.today .num{color:var(--today); font-size:clamp(11px,3.4vw,15px)}
  .cell .todaytag{font-family:'Caveat',cursive; color:var(--today); font-size:clamp(11px,3.4vw,16px); line-height:.9}
  .cards{position:absolute; right:3px; bottom:3px; display:flex}
  /* drawn memo, whole thing tinted by time-to-deadline (calm cream -> red) */
  .card{position:relative; width:clamp(17px,5.2vw,27px); height:clamp(17px,5.2vw,27px); margin-left:-9px;
    border:1.5px solid var(--bd,#9a9074); border-radius:2px; background:var(--pp,#ebe6d2);
    box-shadow:1px 1px 2px rgba(0,0,0,.3); cursor:pointer; transition:transform .08s; overflow:hidden}
  .card:first-child{margin-left:0}
  .card:active{transform:scale(.86)}
  .card .lines{position:absolute; inset:4px 3px 3px 3px;
    background:repeating-linear-gradient(180deg, transparent 0 2.5px, var(--ink,rgba(92,88,68,.4)) 2.5px 3.5px)}
  .card .fold{position:absolute; top:0; right:0; width:0; height:0;
    border-top:7px solid var(--fold,#d8cfb2); border-left:7px solid transparent}
  .card.u0{--pp:#ebe6d2; --bd:#9a9074; --ink:rgba(92,88,68,.40); --fold:#d8cfb2} /* calm  (5+ days) */
  .card.u1{--pp:#f2e2b6; --bd:#bd8a34; --ink:rgba(150,110,40,.45); --fold:#e4cf90} /* warming (3-4) */
  .card.u2{--pp:#f0cf9e; --bd:#c06a26; --ink:rgba(150,80,30,.50); --fold:#e2bd85} /* hot   (1-2)  */
  .card.u3{--pp:#ecc0a8; --bd:#9a3a26; --ink:rgba(140,50,32,.55); --fold:#dcae98} /* critical (due) */
  .footer{border-top:1px solid var(--line); margin-top:clamp(6px,2vw,12px); padding-top:clamp(5px,1.6vw,10px);
    display:flex; justify-content:space-between; font-size:clamp(8px,2.6vw,12px); color:var(--sev-S); letter-spacing:.04em}
  .hud{display:flex; flex-wrap:wrap; gap:clamp(5px,1.6vw,10px); justify-content:center; margin:clamp(8px,2.5vw,14px) auto 0; max-width:960px}
  .tab{background:rgba(246,236,212,.92); border-radius:4px; padding:5px 12px; text-align:center; min-width:64px; box-shadow:0 2px 4px rgba(0,0,0,.3)}
  .tab.click{cursor:pointer; background:rgba(74,58,34,.92); color:var(--cream)}
  .tab .k{font-size:9px; letter-spacing:.12em; color:#8a7a5c; text-transform:uppercase}
  .tab.click .k{color:#b8a888}
  .tab .v{font-size:clamp(14px,4vw,18px); color:var(--ink)}
  .tab.click .v{color:var(--cream)}
  .tab .v.face{font-size:clamp(16px,4.6vw,20px)}
  /* selection panel */
  .scrim{position:fixed; inset:0; background:rgba(20,14,8,.45); display:none; align-items:center; justify-content:center; z-index:30}
  .scrim.on{display:flex}
  .sel{background:#f6ecd4; border:1px solid #c9b88f; box-shadow:0 12px 34px rgba(0,0,0,.55); border-radius:6px;
    padding:16px 18px; width:min(300px,86vw); transform:rotate(-1deg)}
  .sel h4{margin:0 0 4px; font-size:15px; color:#3a2e1c}
  .sel .meta{font-size:11px; color:#8a3a2a; letter-spacing:.06em; margin-bottom:12px}
  .sel button{display:block; width:100%; text-align:left; border:1.5px solid #3a2e1c; background:transparent;
    border-radius:4px; padding:7px 11px; font-family:'Special Elite',monospace; font-size:12px; color:#3a2e1c;
    margin-top:8px; cursor:pointer}
  .sel button.ghost{border-color:#9c8a6a; color:#5a4630}
  .sel button:active{transform:scale(.98)}
  .hint{max-width:960px; margin:10px auto 0; color:var(--cream); opacity:.7; font-size:11px; text-align:center}
  .float{position:absolute; font-family:'Caveat',cursive; font-weight:700; font-size:15px; pointer-events:none;
    animation:up 1.3s ease-out forwards; z-index:20; white-space:nowrap}
  @keyframes up{to{transform:translateY(-26px); opacity:0}}
</style>
</head>
<body>
  <div class="pad">
    <div class="header">
      <span id="mlabel">Month 1</span>
      <span class="right"><span id="dlabel">Day 1 of 30</span> &middot; <span id="newlabel">New 0</span></span>
    </div>
    <div class="board" style="position:relative">
      <div class="dow"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div>
      <div class="cal" id="cal"></div>
      <div class="footer"><span>Missing the deadline &rarr; the Manager's office</span><span id="esc">0</span></div>
    </div>
  </div>

  <div class="hud">
    <div class="tab"><div class="k">Open</div><div class="v" id="hOpen">0</div></div>
    <div class="tab"><div class="k">Fixed</div><div class="v" id="hFixed">0</div></div>
    <div class="tab"><div class="k">Expired</div><div class="v" id="hExp" style="color:#8a3a2a">0</div></div>
    <div class="tab"><div class="k">Reputation</div><div class="v face" id="hRep">🙂</div></div>
    <div class="tab click" id="paceTab"><div class="k">Daily Speed</div><div class="v" id="hPace" style="font-size:14px">wednesday</div></div>
  </div>
  <div class="hint">Flat build · tap a case to work it. Rotate the phone — it reflows, it doesn't shrink.</div>

  <div class="scrim" id="scrim">
    <div class="sel" id="sel">
      <h4 id="selText">—</h4>
      <div class="meta" id="selMeta"></div>
      <button id="btnFix">Fix ✓ (+<span id="selReward">0</span> Fixed)</button>
      <button class="ghost" id="btnDefer">Defer +2 days (3 Fixed)</button>
      <button class="ghost" id="btnClose">Back to the queue</button>
    </div>
  </div>

<script>
(function(){
  "use strict";
  var DAYS=30;
  var POOL=[["It's down.","U"],["Still down.","U"],["It worked yesterday.","R"],["Password reset. Again.","R"],
    ["The attachment didn't attach.","R"],["URGENT!!! (no other text)","S"],["It's making a noise now.","R"],
    ["Where is my refund?","U"],["The app ate my draft.","R"],["Caps lock was on. Is that bad?","R"],
    ["The satellite feed went dark.","U"],["I never got the email. Any email.","R"],["Legal has questions.","S"],
    ["It says error. Just: error.","R"],["My cursor is gone.","R"]];
  var SEV={R:"ROUTINE",U:"URGENT",S:"SEV-1"};
  var REWARD={R:4,U:6,S:10};
  var PACE={friday:[16000,1],wednesday:[11000,2],monday:[7000,3]};
  var SAVE="monthly-queue-flat-save";

  var S={tokens:[],day:1,month:1,ftr:15,EXPIRED:0,REPUTATION:10,monthNew:0,escalatedMonth:0,paceMode:"wednesday",sel:null};
  var tick=null;

  function rnd(n){return Math.floor(Math.random()*n);}
  function mkToken(day){
    var p=POOL[rnd(POOL.length)], sev=p[1];
    var base = sev==="S" ? 1+rnd(2) : sev==="U" ? 2+rnd(4) : 4+rnd(6);
    return {id:Math.random(), due:Math.min(DAYS, day+base), text:p[0], sev:sev};
  }
  function perDay(){return PACE[S.paceMode][1];}
  function interval(){return PACE[S.paceMode][0];}

  function load(){
    var s=null; try{s=JSON.parse(localStorage.getItem(SAVE));}catch(e){}
    if(!s){ S.tokens=[mkToken(1),mkToken(1),mkToken(1)]; S.monthNew=3; return; }
    for(var k in s){ if(S.hasOwnProperty(k)) S[k]=s[k]; }
    S.tokens=(S.tokens||[]).map(function(t){return {id:t.id,due:Math.min(DAYS,t.due),text:t.text,sev:t.sev};});
  }
  function save(){
    try{localStorage.setItem(SAVE,JSON.stringify(S));}catch(e){}
  }

  function repFace(v){return v>=16?"😄":v>=10?"🙂":v>=4?"😐":v>=0?"😟":v>=-5?"😨":"💀";}

  function floatMsg(cell,text,color){
    if(!cell) return;
    var f=document.createElement("div"); f.className="float"; f.textContent=text; f.style.color=color;
    f.style.left="6px"; f.style.top="2px"; cell.appendChild(f);
    setTimeout(function(){ if(f.parentNode) f.parentNode.removeChild(f); },1300);
  }

  function dayTick(){
    if(S.sel!==null) return;                       // pause while a case is open
    var pd=perDay();
    S.day++;
    if(S.day>DAYS){ S.month++; S.day=1; S.monthNew=0; S.escalatedMonth=0;
      S.tokens=S.tokens.map(function(t){return {id:t.id,due:2+rnd(10),text:t.text,sev:t.sev};}); }
    var kept=[];
    for(var i=0;i<S.tokens.length;i++){
      var t=S.tokens[i];
      if(t.due<S.day){ S.EXPIRED++; S.escalatedMonth++; S.REPUTATION=Math.max(-10,S.REPUTATION-2); }
      else kept.push(t);
    }
    for(var j=0;j<pd && kept.length<16;j++){ kept.push(mkToken(S.day)); S.monthNew++; }
    S.tokens=kept;
    save(); render();
  }

  function fixToken(t){
    var r=REWARD[t.sev]||5;
    S.tokens=S.tokens.filter(function(o){return o.id!==t.id;});
    S.ftr+=r; S.REPUTATION=Math.min(20,S.REPUTATION+1); S.sel=null;
    closeSel(); save(); render();
    var cell=document.querySelector('[data-day="'+t.due+'"]');
    floatMsg(cell,"Fixed ✓ +"+r,"#4a5a35");
  }
  function deferToken(t){
    if(S.ftr<3) return;
    S.ftr-=3;
    S.tokens=S.tokens.map(function(o){return o.id===t.id?{id:o.id,due:Math.min(DAYS,o.due+2),text:o.text,sev:o.sev}:o;});
    S.sel=null; closeSel(); save(); render();
  }

  // ---- rendering ----
  var cal=document.getElementById("cal");
  function render(){
    document.getElementById("mlabel").textContent="Month "+S.month;
    document.getElementById("dlabel").textContent="Day "+S.day+" of "+DAYS;
    document.getElementById("newlabel").textContent="New "+S.monthNew;
    document.getElementById("esc").textContent=S.escalatedMonth;
    document.getElementById("hOpen").textContent=S.tokens.length;
    document.getElementById("hFixed").textContent=S.ftr;
    document.getElementById("hExp").textContent=S.EXPIRED;
    document.getElementById("hRep").textContent=repFace(S.REPUTATION);
    document.getElementById("hPace").textContent=S.paceMode;

    // group tokens by due-day
    var byDay={}; S.tokens.forEach(function(t){(byDay[t.due]=byDay[t.due]||[]).push(t);});

    cal.innerHTML="";
    for(var n=1;n<=35;n++){
      var cell=document.createElement("div"); cell.className="cell"; cell.setAttribute("data-day",n);
      var off=n>DAYS, col=(n-1)%7, weekend=col>=5, past=!off&&n<S.day, today=!off&&n===S.day;
      if(off) cell.className+=" off"; else { if(weekend)cell.className+=" weekend"; if(past)cell.className+=" past"; if(today)cell.className+=" today"; }
      var num=document.createElement("div"); num.className="num"; num.textContent=off?"":n; cell.appendChild(num);
      if(today){ var tg=document.createElement("div"); tg.className="todaytag"; tg.textContent="today"; cell.appendChild(tg); }
      if(byDay[n]){
        var wrap=document.createElement("div"); wrap.className="cards";
        byDay[n].forEach(function(t){
          var dl=t.due-S.day, u=dl>=5?"u0":dl>=3?"u1":dl>=1?"u2":"u3";
          var c=document.createElement("div"); c.className="card "+u; c.title=t.text;
          var ln=document.createElement("div"); ln.className="lines"; c.appendChild(ln);
          var fd=document.createElement("div"); fd.className="fold"; c.appendChild(fd);
          c.onclick=(function(tok){return function(){ openSel(tok); };})(t);
          wrap.appendChild(c);
        });
        cell.appendChild(wrap);
      }
      cal.appendChild(cell);
    }
  }

  // ---- selection panel ----
  var scrim=document.getElementById("scrim");
  function openSel(t){ S.sel=t.id;
    document.getElementById("selText").textContent=t.text;
    document.getElementById("selMeta").textContent=SEV[t.sev]+" · due day "+t.due;
    document.getElementById("selReward").textContent=REWARD[t.sev]||5;
    scrim.classList.add("on");
  }
  function closeSel(){ scrim.classList.remove("on"); }
  function selectedToken(){ return S.tokens.filter(function(o){return o.id===S.sel;})[0]; }
  document.getElementById("btnFix").onclick=function(){ var t=selectedToken(); if(t) fixToken(t); };
  document.getElementById("btnDefer").onclick=function(){ var t=selectedToken(); if(t) deferToken(t); };
  document.getElementById("btnClose").onclick=function(){ S.sel=null; closeSel(); };
  scrim.onclick=function(e){ if(e.target===scrim){ S.sel=null; closeSel(); } };

  document.getElementById("paceTab").onclick=function(){
    var order=["friday","wednesday","monday"], next=order[(order.indexOf(S.paceMode)+1)%3];
    S.paceMode=next; restartTick(); save(); render();
  };

  function restartTick(){ if(tick) clearInterval(tick); tick=setInterval(dayTick, interval()); }

  // ---- boot ----
  load(); render(); restartTick();
  setInterval(save,5000);
  window.addEventListener("beforeunload",save);
})();
</script>
</body>
</html>
